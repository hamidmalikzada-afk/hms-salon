name: HMS CI

on:
  push:
    branches:
      - main
      - master
      - "feature/**"
      - "codex/**"
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check backend syntax
        run: |
          for f in backend/config/*.js backend/controllers/*.js backend/middleware/*.js backend/routes/*.js backend/utils/*.js backend/server.js; do
            node --check "$f"
          done

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build backend Docker image
        run: docker build -t hms-backend ./backend

      - name: Build frontend Docker image
        run: docker build -t hms-frontend ./frontend
